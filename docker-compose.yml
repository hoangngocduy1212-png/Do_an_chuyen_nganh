services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status(); } catch (e) {
            rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]});
          } quit(db.hello().isWritablePrimary ? 0 : 1);"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      MONGODB_URI: mongodb://mongo:27017/supermarket?replicaSet=rs0
      MONGO_URI: mongodb://mongo:27017/supermarket?replicaSet=rs0
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_started

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/supermarket?replicaSet=rs0
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data:

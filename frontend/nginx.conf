server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: moi route tra ve index.html
  location / { try_files $uri /index.html; }

  # chuyen /api sang backend (ten service trong docker-compose)
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
  }

  location /uploads/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
  }
}
